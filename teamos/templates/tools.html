{% extends "base.html" %}
{% block title %}Tools & admin{% endblock %}
{% block content %}
<div class="ph"><div><h1>Tools &amp; admin</h1><div class="sub">Everything that isn't daily work, in one place. You see only what your role allows.</div></div></div>
<div class="tool-grid">{% for t in items %}
  <a class="card tool" href="{{ url_for(t.endpoint) }}"><h2>{{ t.title }}</h2><p class="small muted">{{ t.what }}</p></a>{% endfor %}
</div>
{% endblock %}
